<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-hidden="true">
  <defs>
    <filter id="problemCardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Shortened link card -->
  <g transform="rotate(-6 130 82)">
    <rect x="30" y="30" width="200" height="104" fill="#ffffff" stroke="#d4d2d9" stroke-width="1.5" filter="url(#problemCardShadow)" />
    <text x="48" y="55" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1" font-weight="600" fill="#6b6375">SHORTEN</text>
    <text x="48" y="86" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="700">
      <tspan fill="#08060d">opti.link/</tspan><tspan fill="#aa3bff">aB3xQ7</tspan>
    </text>
    <path d="M196 42a4.3 4.3 0 016.1 0l2.5 2.5a4.3 4.3 0 010 6.1l-5.75 5.75m-9.35-2.5l-5.75 5.75a4.3 4.3 0 000 6.1l2.5 2.5a4.3 4.3 0 006.1 0l5.75-5.75" fill="none" stroke="#6b6375" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bio page card -->
  <g transform="rotate(5 345 180)">
    <rect x="250" y="110" width="190" height="140" fill="#ffffff" stroke="#d4d2d9" stroke-width="1.5" filter="url(#problemCardShadow)" />
    <text x="268" y="135" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1" font-weight="600" fill="#6b6375">BIO PAGE</text>
    <circle cx="284" cy="170" r="14" fill="#f4f3ec" stroke="#d4d2d9" stroke-width="1.5" />
    <rect x="268" y="198" width="154" height="16" fill="#f4f3ec" stroke="#d4d2d9" stroke-width="1" />
    <rect x="268" y="222" width="154" height="16" fill="#f4f3ec" stroke="#d4d2d9" stroke-width="1" />
  </g>

  <!-- QR code card -->
  <g transform="rotate(-4 205 265)">
    <rect x="120" y="190" width="170" height="150" fill="#08060d" filter="url(#problemCardShadow)" />
    <text x="138" y="215" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1" font-weight="600" fill="#b8b3c4">QR CODE</text>

    <!-- finder markers -->
    <rect x="138" y="228" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <rect x="145" y="235" width="8" height="8" fill="#ffffff" />
    <rect x="250" y="228" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <rect x="257" y="235" width="8" height="8" fill="#ffffff" />
    <rect x="138" y="304" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <rect x="145" y="311" width="8" height="8" fill="#ffffff" />

    <!-- scattered data modules -->
    <rect x="180" y="236" width="9" height="9" fill="#ffffff" />
    <rect x="198" y="250" width="9" height="9" fill="#ffffff" />
    <rect x="216" y="236" width="9" height="9" fill="#ffffff" />
    <rect x="176" y="270" width="9" height="9" fill="#ffffff" />
    <rect x="216" y="284" width="9" height="9" fill="#aa3bff" />
    <rect x="196" y="300" width="9" height="9" fill="#ffffff" />
    <rect x="240" y="270" width="9" height="9" fill="#ffffff" />
  </g>
</svg>
