<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-hidden="true">
  <defs>
    <filter id="aboutCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect x="60" y="40" width="360" height="280" fill="#ffffff" stroke="#d4d2d9" stroke-width="1.5" filter="url(#aboutCardShadow)" />

  <!-- header -->
  <rect x="80" y="60" width="16" height="16" fill="#aa3bff" />
  <text x="104" y="73" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#08060d">OptiLink</text>
  <line x1="60" y1="96" x2="420" y2="96" stroke="#d4d2d9" stroke-width="1.5" />

  <!-- row dividers -->
  <line x1="60" y1="171" x2="420" y2="171" stroke="#d4d2d9" stroke-width="1" />
  <line x1="60" y1="246" x2="420" y2="246" stroke="#d4d2d9" stroke-width="1" />

  <!-- row 1: shortened link -->
  <path d="M79 128a5 5 0 017.07 0l2.93 2.93a5 5 0 010 7.07l-5.5 5.5m-9-3.5l-5.5 5.5a5 5 0 000 7.07l2.93 2.93a5 5 0 007.07 0l5.5-5.5" fill="none" stroke="#6b6375" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -5) scale(0.85) translate(15 20)" />
  <text x="118" y="139" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="600">
    <tspan fill="#08060d">opti.link/</tspan><tspan fill="#aa3bff">aB3xQ7</tspan>
  </text>
  <text x="400" y="139" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b6375">128 clicks</text>

  <!-- row 2: bio page -->
  <circle cx="87" cy="202.5" r="5.5" fill="none" stroke="#6b6375" stroke-width="1.6" />
  <path d="M77 220c0-7.5 4.5-12 10-12s10 4.5 10 12" fill="none" stroke="#6b6375" stroke-width="1.6" stroke-linecap="round" />
  <text x="118" y="213.5" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="600" fill="#08060d">opti.link/bio/zoe</text>
  <text x="400" y="213.5" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b6375">42 views</text>

  <!-- row 3: qr code -->
  <rect x="78" y="275" width="16" height="16" fill="none" stroke="#6b6375" stroke-width="1.6" />
  <rect x="82" y="279" width="4" height="4" fill="#6b6375" />
  <rect x="86" y="279" width="4" height="4" fill="none" />
  <rect x="82" y="283" width="4" height="4" fill="none" />
  <rect x="86" y="283" width="4" height="4" fill="#6b6375" />
  <text x="118" y="288.5" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="600" fill="#08060d">Product Label</text>
  <text x="400" y="288.5" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b6375">9 scans</text>
</svg>
